name: Release

# 打 tag 即发版：v1.2.0 → 打 DMG → 验证 → 建 Release → 同步 Homebrew cask。
# 人工只负责改版本号、写 CHANGELOG、推 tag（见 .claude/skills/release）
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布
    runs-on: macos-15
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # tag 与 Info.plist 对不上就别往下走了，发出去的包版本号会是错的
      - name: 校验版本号与 tag 一致
        id: meta
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          plist="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$tag" != "$plist" ]; then
            echo "❌ tag v$tag 与 Info.plist 的 $plist 不一致"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "✓ 版本号 $tag"

      # 组装 .app 要把这些工具拷进 bundle
      - name: 安装压缩工具
        run: brew install pngquant oxipng gifsicle

      - name: 打包 DMG
        run: make dmg

      # 从 DMG 里取出 .app 再验：验的必须是用户真正下载到的那一份，
      # 而不是 dist/ 下那个还没进过镜像的
      - name: 验证 bundle 完整性
        run: |
          set -euo pipefail
          dmg="dist/Minim-${{ steps.meta.outputs.version }}.dmg"
          # 卷名是中文「轻图」，awk '{print $NF}' 会取错，必须这样抠挂载点
          mnt="$(hdiutil attach "$dmg" -nobrowse -readonly | grep -o '/Volumes/.*$' | head -1)"
          rm -rf /tmp/minim-verify && mkdir -p /tmp/minim-verify
          cp -R "$mnt/轻图.app" /tmp/minim-verify/
          hdiutil detach "$mnt" -quiet
          bash scripts/verify-bundle.sh /tmp/minim-verify/轻图.app | tee /tmp/tools.txt
          # 打进包里的 pngquant/oxipng/gifsicle 来自 runner 的 brew，版本会随时间漂移，
          # 记进 summary 方便日后追溯「这一版到底带的哪个版本」
          {
            echo "### bundle 内的压缩工具"
            echo '```'
            cat /tmp/tools.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 说明取自 CHANGELOG 对应小节，保证 Release 与 CHANGELOG 不会各写一套
      - name: 生成发布说明
        run: |
          set -euo pipefail
          v="${{ steps.meta.outputs.version }}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "❌ CHANGELOG.md 里没有 [$v] 这一节，请先补上再打 tag"
            exit 1
          fi
          printf '### 安装\n\n' >> /tmp/notes.md
          printf '    brew install --cask syanbo/tap/minim\n\n' >> /tmp/notes.md
          printf '或下载下方 DMG 拖进「应用程序」。要求 macOS 14+ / Apple Silicon。\n\n' >> /tmp/notes.md
          printf '本 App 为 ad-hoc 签名、未经 Apple 公证，首次打开若提示「无法验证开发者」，\n' >> /tmp/notes.md
          printf '请到「系统设置 → 隐私与安全性」点「仍要打开」。\n' >> /tmp/notes.md
          cat /tmp/notes.md

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.meta.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" "dist/Minim-$v.dmg" \
            --title "轻图 Minim $v" \
            --notes-file /tmp/notes.md

      # GitHub 会过滤附件名里的非 ASCII 字符，「轻图-1.0.0.dmg」曾被截成「-1.0.0.dmg」
      - name: 核对附件名是 ASCII
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.meta.outputs.version }}"
          names="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          if [ "$names" != "Minim-$v.dmg" ]; then
            echo "❌ 附件名异常：$names"
            exit 1
          fi
          echo "✓ 附件 Minim-$v.dmg"

  cask:
    name: 同步 Homebrew cask
    needs: release
    runs-on: macos-15
    steps:
      # 不更新 cask 的话 brew 用户会静默停在旧版本，所以这里宁可红也不静默跳过
      - name: 检查 tap 令牌
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "❌ 缺少 secret TAP_TOKEN"
            echo "   需要一个对 syanbo/homebrew-tap 有 contents:write 的细粒度 PAT，"
            echo "   存到本仓库 Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: syanbo/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}

      # sha256 必须取 Release 上那一份：本地重打包的 DMG 字节不一致，装的人会校验失败
      - name: 更新 version 与 sha256
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo syanbo/Minim \
            --pattern "Minim-$VERSION.dmg" --dir /tmp
          sha="$(shasum -a 256 "/tmp/Minim-$VERSION.dmg" | cut -d' ' -f1)"
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/" Casks/minim.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/minim.rb
          ruby -c Casks/minim.rb
          git diff -- Casks/minim.rb

      - name: 提交并推送
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/minim.rb; then
            echo "❌ cask 没有任何变化，版本号可能没更新"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: minim $VERSION" -- Casks/minim.rb
          git push
          echo "✓ cask 已更新到 $VERSION"
